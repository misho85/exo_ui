name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4.1"
          elixir-version: "1.19.5"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install Elixir dependencies
        run: |
          mix deps.get
          mix hex.audit
          cd storybook
          mix deps.get
          mix hex.audit
          mix assets.setup

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bunx playwright install --with-deps chromium

      - name: Compile and test
        run: |
          bun run check:css
          mix format --check-formatted
          mix compile --warnings-as-errors
          mix test
          cd storybook
          mix assets.build
          mix compile --warnings-as-errors
          mix test

      - name: Browser tests
        run: bun run test:browser

      - name: Visual regression
        run: |
          (cd storybook && PLAYWRIGHT=1 mix phx.server) &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4100/welcome >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4100/welcome >/dev/null
          bun run capture:components
          bun run capture:validate
          bun run visual:check

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: |
            output/playwright
            playwright-report
            test-results

  # ---- Release: the artifact production runs (KRF-611, fleet pattern KRF-221) ----
  # `test` builds under MIX_ENV=test and dev, so a prod-only compile error, the
  # esbuild step of the image and a `config/runtime.exs` that raises first ran in
  # the Dokploy build and in the new container on the box, AFTER the merge.
  #
  # This job is the builder stage of the root `Dockerfile`, command for command,
  # on the SAME image (`storybook/test/storybook_web/release_distribution_test.exs`
  # fails when they drift: mix commands, apt packages, image, MIX_ENV), plus what
  # the Dockerfile cannot do: boot the built release through `runtime.exs`, with
  # negatives (`scripts/release-config-check.sh`), and check that epmd and
  # distribution listen on loopback only (`scripts/release-dist-check.sh`).
  #
  # It is not a deploy step: the way to production stays merge -> Dokploy
  # auto-deploy (owner's decision, re24 RE-51). It runs after `test`, the last of
  # the judging jobs, so every cheaper failure arrives first. Nothing restores a
  # `_build` here; `--overwrite` only keeps `mix release` from prompting if a
  # cache is ever added.
  release:
    name: Release
    needs: test
    runs-on: ubuntu-latest
    container:
      image: hexpm/elixir:1.19.5-erlang-28.4.1-ubuntu-noble-20260217
    env:
      MIX_ENV: prod

    steps:
      # The builder stage's packages, before checkout so it clones with git.
      - name: Install build packages
        run: apt-get update && apt-get install -y --no-install-recommends build-essential git ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Hex and Rebar
        run: mix local.hex --force && mix local.rebar --force

      - name: Fetch dependencies
        working-directory: storybook
        run: mix deps.get --only prod

      - name: Compile dependencies
        working-directory: storybook
        run: mix deps.compile

      - name: Build assets
        working-directory: storybook
        run: mix esbuild.install --if-missing && mkdir -p priv/static/assets && mix esbuild storybook

      - name: Compile
        working-directory: storybook
        run: mix compile

      - name: Build release
        working-directory: storybook
        run: mix release --overwrite

      - name: Boot runtime.exs
        run: ./scripts/release-config-check.sh

      # epmd, the node and the `rpc` client listen on loopback only (KRF-493).
      - name: Distribution on loopback
        run: ./scripts/release-dist-check.sh
