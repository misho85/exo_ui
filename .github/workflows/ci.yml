name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4.1"
          elixir-version: "1.19.5"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install Elixir dependencies
        run: |
          mix deps.get
          cd storybook
          mix deps.get
          mix assets.setup

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bunx playwright install --with-deps chromium

      - name: Compile and test
        run: |
          mix compile --warnings-as-errors
          mix test
          bun run build:all
          cd storybook
          mix assets.build
          mix compile --warnings-as-errors

      - name: Browser tests
        run: bun run test:browser

      - name: Visual regression
        run: |
          (cd storybook && PLAYWRIGHT=1 mix phx.server) &
          server_pid=$!
          trap 'kill "$server_pid" >/dev/null 2>&1 || true' EXIT

          for _ in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:4100/welcome >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:4100/welcome >/dev/null
          bun run capture:components
          bun run capture:validate
          bun run visual:check

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: |
            output/playwright
            playwright-report
            test-results
