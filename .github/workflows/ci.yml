name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Erlang and Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "28.4.1"
          elixir-version: "1.19.5"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - name: Install Elixir dependencies
        run: |
          mix deps.get
          mix hex.audit
          cd storybook
          mix deps.get
          mix hex.audit
          mix assets.setup

      - name: Install JS dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browser and media tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          bunx playwright install --with-deps chromium

      - name: Compile and test
        run: |
          bun run check:css
          mix format --check-formatted
          mix compile --warnings-as-errors
          cd storybook
          mix assets.build
          mix compile

      - name: Browser tests
        run: bunx playwright test test/browser/data_table_workflow.spec.js --repeat-each=20 --retries=0

      - name: Upload browser artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-artifacts
          path: |
            output/playwright
            playwright-report
            test-results
